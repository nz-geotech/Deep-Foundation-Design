function groupGeometry(shape,w,h,nx,ny,sx,sy,pattern){
 const stagger=pattern==='Triangular (staggered rows)';
 const centres=[];
 const nalt=Math.max(1,Math.floor(Number(document.getElementById("nalt")?.value)||1));
 for(let j=0;j<ny;j++){const count=stagger&&j%2?nalt:nx;const offset=stagger&&j%2?sx/2:0;for(let i=0;i<count;i++)centres.push([i*sx+offset,j*sy]);}
 const hull=pts=>{pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);if(pts.length<=1)return pts;const cross=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);let lower=[],upper=[];for(const pt of pts){while(lower.length>1&&cross(lower[lower.length-2],lower[lower.length-1],pt)<=0)lower.pop();lower.push(pt)}for(const pt of pts.slice().reverse()){while(upper.length>1&&cross(upper[upper.length-2],upper[upper.length-1],pt)<=0)upper.pop();upper.push(pt)}lower.pop();upper.pop();return lower.concat(upper)};
 // Circular group boundary: convex hull of pile centres, offset by pile radius.
 // Area = hull area + r * hull perimeter + pi*r²; perimeter = hull perimeter + 2*pi*r.
 const ch=hull(centres),r=w/2;
 const chArea=ch.length<3?0:Math.abs(ch.reduce((a,p,i)=>{let q=ch[(i+1)%ch.length];return a+p[0]*q[1]-q[0]*p[1]},0))/2;
 const chPer=ch.length===1?0:ch.length===2?2*Math.hypot(ch[1][0]-ch[0][0],ch[1][1]-ch[0][1]):ch.reduce((a,p,i)=>{let q=ch[(i+1)%ch.length];return a+Math.hypot(q[0]-p[0],q[1]-p[1])},0);
 let pts=[];
 if(shape==='Circular'){
  // Sample rounded perimeter only for SVG display; analytic area/perimeter above.
  for(const [x,y] of centres)for(let k=0;k<48;k++){let t=2*Math.PI*k/48;pts.push([x+r*Math.cos(t),y+r*Math.sin(t)])}
 }else for(const [x,y] of centres)for(const dx of [-w/2,w/2])for(const dy of [-h/2,h/2])pts.push([x+dx,y+dy]);
 const boundary=hull(pts),minX=Math.min(...boundary.map(p=>p[0])),maxX=Math.max(...boundary.map(p=>p[0])),minY=Math.min(...boundary.map(p=>p[1])),maxY=Math.max(...boundary.map(p=>p[1]));
 const polyArea=boundary.length<3?0:Math.abs(boundary.reduce((a,p,i)=>{let q=boundary[(i+1)%boundary.length];return a+p[0]*q[1]-q[0]*p[1]},0))/2;
 const polyPer=boundary.reduce((a,p,i)=>{let q=boundary[(i+1)%boundary.length];return a+Math.hypot(q[0]-p[0],q[1]-p[1])},0);
 return {centres,boundary,minX,maxX,minY,maxY,bw:maxX-minX,bl:maxY-minY,area:shape==='Circular'?chArea+r*chPer+Math.PI*r*r:polyArea,perimeter:shape==='Circular'?chPer+2*Math.PI*r:polyPer};
}
function drawPileGroupPlan(shape,w,h,nx,ny,sx,sy,pattern){
 const host=document.getElementById('sectiondrawing');
 if(!Number.isInteger(nx)||!Number.isInteger(ny)||nx<1||ny<1||sx<=0||sy<=0||nx*ny>400){host.innerHTML='<p class="note">Enter valid group geometry (maximum 400 piles for the diagram).</p>';return;}
 const g=groupGeometry(shape,w,h,nx,ny,sx,sy,pattern),W=780,H=520,plotW=530,plotH=300;
 const scale=Math.min(plotW/Math.max(g.bw,.01),plotH/Math.max(g.bl,.01));
 const left=(W-g.bw*scale)/2,top=92+(plotH-g.bl*scale)/2;
 const X=x=>left+(x-g.minX)*scale,Y=y=>top+(y-g.minY)*scale,esc=n=>n.toFixed(3);
 const dimH=(x1,x2,y,label)=>`<path d="M${x1} ${y-7}v14 M${x2} ${y-7}v14 M${x1} ${y}H${x2}" stroke="#176b9b" stroke-width="1.4" fill="none"/><text x="${(x1+x2)/2}" y="${y-9}" text-anchor="middle" font-size="12" fill="#174a6b">${label}</text>`;
 const dimV=(y1,y2,x,label)=>{const tx=x-16,ty=(y1+y2)/2;return `<path d="M${x-7} ${y1}h14 M${x-7} ${y2}h14 M${x} ${y1}V${y2}" stroke="#176b9b" stroke-width="1.4" fill="none"/><text x="${tx}" y="${ty}" transform="rotate(-90 ${tx} ${ty})" text-anchor="middle" font-size="12" fill="#174a6b">${label}</text>`};
 let piles='';for(const [a,b] of g.centres){const x=X(a),y=Y(b),pw=w*scale,ph=h*scale;
 if(shape==='Circular')piles+=`<circle cx="${x}" cy="${y}" r="${pw/2}" fill="#9dc4db" stroke="#245a7b" stroke-width="1.5"/>`;
 else if(shape==='H-pile'){const t=Math.max(1.5,Math.min(pw,ph)*.13),xl=x-pw/2,yt=y-ph/2;piles+=`<path d="M${xl} ${yt}h${pw}v${t}h${-(pw-t)/2}v${ph-2*t}h${(pw-t)/2}v${t}h${-pw}v${-t}h${(pw-t)/2}v${-(ph-2*t)}h${-(pw-t)/2}Z" fill="#9dc4db" stroke="#245a7b" stroke-width="1.5"/>`}
 else piles+=`<rect x="${x-pw/2}" y="${y-ph/2}" width="${pw}" height="${ph}" fill="#9dc4db" stroke="#245a7b" stroke-width="1.5"/>`;
 piles+=`<circle cx="${x}" cy="${y}" r="2" fill="#174a6b"/>`}
 const boundary=g.boundary.map(([x,y])=>`${X(x)},${Y(y)}`).join(' ');
 let dimensions=dimH(left,left+g.bw*scale,top+g.bl*scale+45,`Block width = ${esc(g.bw)} m`)+dimV(top,top+g.bl*scale,left-45,`Block length = ${esc(g.bl)} m`);

function updateDrawings(rows,L,gw,scour,w,h,shape){
const ids={dia:['Circular'],side:['Square'],rw:['Rectangular'],rd:['Rectangular'],b:['H-pile'],d:['H-pile']};
for(let [id,types] of Object.entries(ids)){let e=document.getElementById(id);e.disabled=!types.includes(shape);e.closest('label').style.opacity=e.disabled?'.42':'1';}
let size=Math.max(w,h,.01),scale=155/size,cx=210,cy=125,ww=w*scale,hh=h*scale;
let dimension=(x1,y1,x2,y2,label)=>`<path d="M${x1} ${y1}L${x2} ${y2}" stroke="#176b9b" stroke-width="1.4"/><text x="${(x1+x2)/2}" y="${(y1+y2)/2-6}" text-anchor="middle" font-size="10" fill="#183750">${label}</text>`;
let section='';if(shape==='Circular')section=`<circle cx="${cx}" cy="${cy}" r="${ww/2}" fill="#c4dce9" stroke="#245a7b" stroke-width="2.5"/>`;
else if(shape==='H-pile'){let t=Math.max(5,Math.min(14,Math.min(ww,hh)*.1));section=`<path d="M${cx-ww/2} ${cy-hh/2}h${ww}v${t}h${-(ww-t)/2}v${hh-2*t}h${(ww-t)/2}v${t}h${-ww}v${-t}h${(ww-t)/2}v${-(hh-2*t)}h${-(ww-t)/2}Z" fill="#a5bdcb" stroke="#245a7b" stroke-width="2"/>`}
else section=`<rect x="${cx-ww/2}" y="${cy-hh/2}" width="${ww}" height="${hh}" fill="#c4dce9" stroke="#245a7b" stroke-width="2.5"/>`;
let dims=dimension(cx-ww/2,cy+hh/2+22,cx+ww/2,cy+hh/2+22,`${w.toFixed(3)} m`)+`<path d="M${cx+ww/2+25} ${cy-hh/2}v${hh}" stroke="#176b9b"/><text x="${cx+ww/2+32}" y="${cy}" font-size="10" fill="#183750">${h.toFixed(3)} m</text>`;
document.getElementById('sectiondrawing').innerHTML=`<svg viewBox="0 0 480 300" role="img" aria-label="Scaled ${shape} section plan">${section}${dims}<text x="210" y="282" text-anchor="middle" font-size="10">${shape} section — plan</text></svg>`;
let maxDepth=Math.max(L,gw,...rows.map(r=>r.bottom),scour,1),top=40,bot=420,sy=d=>top+Math.max(0,d)/maxDepth*(bot-top),pileW=Math.max(9,Math.min(125,w*105)),px=300-pileW/2;

function calc(){const vm2=text('ref').includes('B1/VM2');for(const id of ['tp-compression-figure','tp-compression-caption']){const el=document.getElementById(id);if(el)el.style.display=vm2?'none':(id.includes('figure')?'block':'');}for(const id of ['vm2-compression-figure','vm2-compression-caption']){const el=document.getElementById(id);if(el)el.style.display=vm2?(id.includes('figure')?'block':''):'none';}const refSelect=document.getElementById('ref'),headerRef=document.getElementById('headerCalcReference');if(refSelect&&headerRef)headerRef.textContent='Based on '+refSelect.value;if(!document.getElementById('soilrows'))return;
 const soilTab=document.getElementById('soilrows').closest('.card');

 for(const id of ['designcase','usesr','alphainterface']){const el=document.getElementById(id);el.closest('label').style.display=vm2?'none':'';}
 const excludeLabel=document.getElementById('include300').closest('label');excludeLabel.lastChild.textContent=vm2?'Ignore top 1 m depth for shaft resistance (no double-counting with scour)':'Ignore top 300 mm depth from overburden stress (SLS and ULS; no double-counting with scour)';
 soilTab.querySelectorAll('thead th,tbody tr').forEach(el=>{});
 const table=soilTab.querySelector('table');for(const idx of [9,10]){const head=table.querySelector('thead tr').children[idx];if(head)head.style.display=vm2?'none':'';for(const tr of table.tBodies[0].rows){if(tr.children[idx])tr.children[idx].style.display=vm2?'none':'';}}
 if(vm2){for(const th of table.querySelectorAll('thead th'))th.style.display='';for(const tr of table.tBodies[0].rows)for(const td of tr.cells)td.style.display='';}
 for(const tr of table.tBodies[0].rows)tr.querySelector('.vm2-behaviour-cell').style.display=vm2?'':'none';
 for(const tr of table.tBodies[0].rows){const behaviour=tr.querySelector('.vm2-behaviour')?.value||'drained';const e=[...tr.querySelectorAll('input[data-soil-index]')].sort((a,b)=>Number(a.dataset.soilIndex)-Number(b.dataset.soilIndex));for(const idx of [5,9,10,11,12]){if(e[idx]){e[idx].disabled=vm2&&(behaviour==='undrained'?idx!==12:idx===12);e[idx].style.opacity=e[idx].disabled?'0.5':'';}}if(e[7]){e[7].disabled=vm2&&behaviour==='drained';e[7].style.opacity=e[7].disabled?'0.5':'';} }
 const capmode=document.getElementById('capacitymode');capmode.style.display='';
 // Keep TP and VM2 resistance contribution choices available.
 const soilTbl=document.getElementById('soilrows').closest('table');
 const hdr=[...soilTbl.querySelectorAll('thead th')];
 for(const heading of ["c′ (kPa)","Sr (kPa)"]){const ix=hdr.findIndex(h=>h.textContent.trim()===heading);if(ix>=0){hdr[ix].style.display='none';for(const tr of soilTbl.tBodies[0].rows)if(tr.cells[ix])tr.cells[ix].style.display='none';}}

// V6.8: Local JSON save/reload, preserving editable data, manual overrides and selections.
function foundationFileStatus(message){const e=document.getElementById('fileActionStatus');if(e)e.textContent=message;}
function foundationFileSnapshot(){
 const values={};document.querySelectorAll('input[id],select[id],textarea[id]').forEach(e=>{
  if(e.id==='foundationFileInput')return;
  values[e.id]={value:e.value,checked:e.type==='checkbox'?e.checked:undefined};
 });
 const soilRows=[...document.querySelectorAll('#soilrows tr')].map(tr=>({behaviour:tr.querySelector('.vm2-behaviour')?.value,inputs:[...tr.querySelectorAll('input')].map(e=>({value:e.value,checked:e.checked,override:e.dataset.override||null}))}));
 return {format:'deep-foundation-portal',version:1,savedAt:new Date().toISOString(),values,soilRows,
  toePressureOverrides, toePressureOverrideEnabled,shaftFssOverrides,shaftFsuOverrides,shaftOverrideEnabled,
  toePhiInput,toeSuInput,tpFoundingLayerLabelOverride,tpToeGammaOverride,vm2ToeBehaviourOverride,vm2ToePhiOverride,vm2ToeSuOverride,vm2ToeGammaOverride,vm2ToeDOverride,vm2FoundingLayerLabelOverride,vm2UserBaseEnabled,vm2UserBaseValue,vm2ConcreteFcu,appliedCompressionLoad,vm2UpliftPhiW,tpUpliftPhiPc,tpUpliftPhiW,tpUpliftPhiTS,tpUpliftDemand,activeTab:Math.max(0,P.findIndex(p=>p.classList.contains('active')))};
}
function saveFoundationFile(){
 try{const data=JSON.stringify(foundationFileSnapshot(),null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='deep_foundation_design_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);foundationFileStatus('Design file saved as JSON.');
 }catch(err){foundationFileStatus('Unable to save file: '+err.message)}
}
function restoreFoundationFile(data){
 if(!data||data.format!=='deep-foundation-portal'||data.version!==1||!Array.isArray(data.soilRows)||!data.values)throw Error('This is not a supported deep foundation design file.');
 if(data.soilRows.length<1||data.soilRows.length>200)throw Error('Invalid soil-layer count.');
 // Build all rows before restoring their input values and override flags.
 const tbody=document.getElementById('soilrows');tbody.innerHTML='';
 for(let i=0;i<data.soilRows.length;i++)addLayer();
 [...tbody.querySelectorAll('tr')].forEach((tr,i)=>{
  const inputs=[...tr.querySelectorAll('input')],saved=data.soilRows[i].inputs;
  if(!Array.isArray(saved)||saved.length!==inputs.length)throw Error('Soil row structure does not match the portal.');
  if(tr.querySelector('.vm2-behaviour'))tr.querySelector('.vm2-behaviour').value=data.soilRows[i].behaviour||'drained';inputs.forEach((e,j)=>{if(e.type==='checkbox')e.checked=!!saved[j].checked;else e.value=String(saved[j].value??'');if(saved[j].override==='1')e.dataset.override='1';else delete e.dataset.override;});
 });
 Object.entries(data.values).forEach(([id,stored])=>{const e=document.getElementById(id);if(!e||id==='foundationFileInput')return;if(e.type==='checkbox')e.checked=!!stored.checked;else e.value=stored.value??'';});
 toePressureOverrides={SLS:null,ULS:null,...data.toePressureOverrides};
 toePressureOverrideEnabled={SLS:false,ULS:false,...data.toePressureOverrideEnabled};
 shaftFssOverrides=data.shaftFssOverrides||{};shaftFsuOverrides=data.shaftFsuOverrides||{};
 shaftOverrideEnabled={SLS:{},ULS:{},...data.shaftOverrideEnabled};
 toePhiInput=data.toePhiInput??null;toeSuInput=data.toeSuInput??null;tpFoundingLayerLabelOverride=data.tpFoundingLayerLabelOverride??null;tpToeGammaOverride=data.tpToeGammaOverride??null;vm2ToeBehaviourOverride=data.vm2ToeBehaviourOverride??null;vm2ToePhiOverride=data.vm2ToePhiOverride??null;vm2ToeSuOverride=data.vm2ToeSuOverride??null;vm2ToeGammaOverride=data.vm2ToeGammaOverride??null;vm2ToeDOverride=data.vm2ToeDOverride??null;vm2FoundingLayerLabelOverride=data.vm2FoundingLayerLabelOverride??null;vm2FoundingLayerOverride=null;vm2UserBaseEnabled=data.vm2UserBaseEnabled??false;vm2UserBaseValue=data.vm2UserBaseValue??null;vm2ConcreteFcu=data.vm2ConcreteFcu??40;appliedCompressionLoad=String(data.appliedCompressionLoad??'');vm2UpliftPhiW=Number.isFinite(Number(data.vm2UpliftPhiW))&&Number(data.vm2UpliftPhiW)>=0&&Number(data.vm2UpliftPhiW)<=1?Number(data.vm2UpliftPhiW):1.0;
 tpUpliftPhiPc=Number.isFinite(Number(data.tpUpliftPhiPc))?Number(data.tpUpliftPhiPc):0.5;tpUpliftPhiW=Number.isFinite(Number(data.tpUpliftPhiW))?Number(data.tpUpliftPhiW):1;tpUpliftPhiTS=Number.isFinite(Number(data.tpUpliftPhiTS))?Number(data.tpUpliftPhiTS):1;tpUpliftDemand=String(data.tpUpliftDemand??'');calc();show(Math.max(0,Math.min(P.length-1,Number(data.activeTab)||0)));
}
async function loadFoundationFile(event){const file=event.target.files?.[0];if(!file)return;
 try{const data=JSON.parse(await file.text());restoreFoundationFile(data);foundationFileStatus('Loaded '+file.name+'.');}
 catch(err){foundationFileStatus('Could not load file: '+err.message)}finally{event.target.value='';}
}

 if(summaryHeadings.length>=6){
   summaryHeadings[0].innerHTML=vm2?'Design Compression capacity V<sub>d</sub> (kN)':`Design Compression capacity ${tpSymbol} (kN)`;
   summaryHeadings[1].innerHTML=vm2?'Applied Compression load V* (kN)':'Applied Compression load Q* (kN)';
   summaryHeadings[3].innerHTML=vm2?'Design Uplift (Tension) capacity V<sub>d</sub> (kN)':`Design Uplift (Tension) capacity ${tpSymbol} (kN)`;
   summaryHeadings[4].innerHTML=vm2?'Applied Uplift (Tension) load V* (kN)':'Applied Uplift (Tension) load Q* (kN)';
 }
 const c=document.getElementById('compressionCompliance');
 const u=document.getElementById(vm2?'vm2UpliftCompliance':'tpUpliftCompliance');
 const cp=document.getElementById('summaryCompressionCapacity');
 const cd=document.getElementById('summaryCompressionDemand');
 const cs=document.getElementById('summaryCompressionCompliance');
 const up=document.getElementById('summaryUpliftCapacity');
 const ud=document.getElementById('summaryUpliftDemand');
 const us=document.getElementById('summaryUpliftCompliance');
 const capacity=Number(c?.dataset.capacity);
 cp.textContent=c?.dataset.capacity!==undefined&&Number.isFinite(capacity)?num(capacity):'—';
 const demand=appliedCompressionLoad;
 cd.textContent=demand!==''&&Number.isFinite(Number(demand))?num(Number(demand)):'—';
 const cstatus=c?.textContent?.trim()||'—';
 cs.textContent=cstatus;cs.style.color=cstatus==='PASS'?'#16803c':cstatus==='FAIL'?'#c62828':'#666';cs.style.fontWeight='700';
 if(vm2){
   const v=Number(u?.dataset.capacity);
   up.textContent=u?.dataset.capacity!==undefined&&Number.isFinite(v)?num(v):'—';
   const demandInput=document.getElementById('vm2upliftDemand');
   ud.textContent=demandInput&&demandInput.value!==''&&Number.isFinite(Number(demandInput.value))?num(Number(demandInput.value)):'—';
   const status=u?.textContent?.trim()||'—';
   us.textContent=status;us.style.color=status==='PASS'?'#16803c':status==='FAIL'?'#c62828':'#666';us.style.fontWeight='700';
 }else{
   const tpCapacity=Number(u?.dataset.capacity);
   up.textContent=u?.dataset.capacity!==undefined&&Number.isFinite(tpCapacity)?num(tpCapacity):'—';
   ud.textContent=tpUpliftDemand!==''&&Number.isFinite(Number(tpUpliftDemand))?num(Number(tpUpliftDemand)):'—';
   const status=u?.textContent?.trim()||'—';
   us.textContent=status;us.style.color=status==='PASS'?'#16803c':status==='FAIL'?'#c62828':'#666';us.style.fontWeight='700';
 }
}
const calcBeforeResultsSummary=calc;
// Capacity-versus-length plot: run the actual selected TP or B1/VM2 calculation
// for each trial length. Temporarily extend the last soil layer when necessary;
// restore all user inputs and the selected length before leaving this routine.
function refreshPileLengthCapacityChart(){
 const canvas=document.getElementById('pileLengthCapacityChart');
 const lengthInput=document.getElementById('length');
 const soilRows=[...document.querySelectorAll('#soilrows tr')];
 if(!canvas||!lengthInput||!soilRows.length)return;
 const originalLength=lengthInput.value;
 const finalRow=soilRows.reduce((best,tr)=>{
  const inputs=[...tr.querySelectorAll('input[data-soil-index]')];
  const bottom=inputs.find(e=>e.dataset.soilIndex==='2');
  return bottom&&(!best||Number(bottom.value)>Number(best.value))?{bottom,value:bottom.value}:best;
 },null);
 if(!finalRow)return;
 const originalBottom=finalRow.value;
 const lengths=[5,10,15,20,25,30];
 const current=Number(originalLength);
 if(Number.isFinite(current)&&current>0&&!lengths.some(x=>Math.abs(x-current)<1e-6))lengths.push(current);
 lengths.sort((a,b)=>a-b);
 const points=[];
 try{
  for(const trial of lengths){
   lengthInput.value=String(trial);
   if(trial>Number(originalBottom))finalRow.bottom.value=String(trial);
   else finalRow.bottom.value=originalBottom;
   calcBeforeResultsSummary();
   updateResultsSummary();
   const c=Number(document.getElementById('summaryCompressionCapacity')?.textContent?.replace(/,/g,''));
   const u=Number(document.getElementById('summaryUpliftCapacity')?.textContent?.replace(/,/g,''));
   points.push({length:trial,compression:Number.isFinite(c)?Math.max(0,c):0,uplift:Number.isFinite(u)?Math.max(0,u):0});
  }
 }catch(err){console.warn('Pile-length chart calculation:',err);}
 finally{
  lengthInput.value=originalLength;
  finalRow.bottom.value=originalBottom;
  calcBeforeResultsSummary();
  updateResultsSummary();
 }
 if(!points.length)return;
 const ctx=canvas.getContext('2d');if(!ctx)return;
 const W=1000,H=510,ratio=Math.max(1,window.devicePixelRatio||1);
 canvas.width=Math.round(W*ratio);canvas.height=Math.round(H*ratio);
 ctx.setTransform(ratio,0,0,ratio,0,0);
 ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);
 const left=85,right=25,top=65,bottom=75;
 const plotW=W-left-right,plotH=H-top-bottom;
 const maximum=Math.max(1,...points.flatMap(p=>[p.compression,p.uplift]));
 const magnitude=Math.pow(10,Math.floor(Math.log10(maximum/5)));
 const rawStep=maximum/5/magnitude;
 const step=(rawStep<=1?1:rawStep<=2?2:rawStep<=5?5:10)*magnitude;
 const yMax=Math.ceil(maximum/step)*step;
 ctx.font='14px Arial, sans-serif';ctx.textAlign='right';ctx.textBaseline='middle';
 for(let i=0;i<=Math.round(yMax/step);i++){
  const value=i*step,y=top+plotH*(1-value/yMax);
  ctx.strokeStyle='#d9e0e6';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(left,y);ctx.lineTo(W-right,y);ctx.stroke();
  ctx.fillStyle='#35485b';ctx.fillText(Number(value.toFixed(2)).toLocaleString(),left-12,y);
 }
 ctx.strokeStyle='#526579';ctx.beginPath();ctx.moveTo(left,top);ctx.lineTo(left,top+plotH);ctx.lineTo(W-right,top+plotH);ctx.stroke();
 ctx.save();ctx.translate(25,top+plotH/2);ctx.rotate(-Math.PI/2);ctx.textAlign='center';ctx.fillStyle='#253c55';ctx.fillText('Design pile capacity (kN)',0,0);ctx.restore();
 const slot=plotW/points.length,barW=Math.min(42,slot*0.31);
 for(let i=0;i<points.length;i++){
  const p=points[i],cx=left+slot*(i+.5);
  for(const [j,value,color] of [[0,p.uplift,'#f6d981'],[1,p.compression,'#e88136']]){
   const x=cx+(j===0?-barW-2:2),height=plotH*value/yMax,y=top+plotH-height;
   ctx.fillStyle=color;ctx.fillRect(x,y,barW,height);ctx.strokeStyle='#8b6b3e';ctx.strokeRect(x,y,barW,height);
   ctx.fillStyle='#23354a';ctx.font='12px Arial, sans-serif';ctx.textAlign='center';ctx.textBaseline='bottom';
   ctx.fillText(Number(value.toFixed(1)).toLocaleString(),x+barW/2,Math.max(top+10,y-5));
  }
  ctx.fillStyle='#24394e';ctx.font='14px Arial, sans-serif';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(String(p.length),cx,top+plotH+10);
 }
 ctx.fillStyle='#253c55';ctx.font='14px Arial, sans-serif';ctx.textAlign='center';ctx.fillText('Pile length (m)',left+plotW/2,H-30);
 const legendY=22;ctx.textAlign='left';ctx.textBaseline='middle';
 ctx.fillStyle='#f6d981';ctx.fillRect(W/2-140,legendY,14,14);ctx.strokeStyle='#8b6b3e';ctx.strokeRect(W/2-140,legendY,14,14);
 ctx.fillStyle='#253c55';ctx.fillText('Uplift (Tension)',W/2-120,legendY+7);
 ctx.fillStyle='#e88136';ctx.fillRect(W/2+40,legendY,14,14);ctx.strokeStyle='#8b6b3e';ctx.strokeRect(W/2+40,legendY,14,14);
 ctx.fillStyle='#253c55';ctx.fillText('Compression',W/2+60,legendY+7);
}
calc=function(){calcBeforeResultsSummary();updateResultsSummary();refreshPileLengthCapacityChart();};
document.addEventListener('input',event=>{
 if(event.target?.id==='vm2upliftDemand'||event.target?.closest?.('#capacitydetail'))requestAnimationFrame(updateResultsSummary);
});
document.addEventListener('change',event=>{
 if(event.target?.id==='vm2upliftDemand'||event.target?.closest?.('#capacitydetail'))requestAnimationFrame(updateResultsSummary);
});
// V8.45: the initial page calculation occurs above the results-chart wrapper.
// Initialise the summary and chart on first load regardless of the default
// calculation reference (TP or B1/VM2); do not require switching methods.
if(document.readyState==='loading'){
 document.addEventListener('DOMContentLoaded',()=>calc(),{once:true});
}else{
 calc();
}

</script></body></html>
